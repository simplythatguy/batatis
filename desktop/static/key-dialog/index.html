<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="color-scheme" content="light" />
    <title>API key</title>
    <link rel="stylesheet" href="dialog.css" />
    <script src="dialog.js" defer></script>
  </head>
  <body>
    <form id="form" autocomplete="off">
      <label id="label" for="key">API key</label>
      <input id="key" type="password" autocomplete="off" spellcheck="false" autocapitalize="off" required />
      <p id="note" class="note" role="status">Encrypted on this computer. Batatis never shows it again.</p>
      <div class="actions">
        <button type="button" id="cancel">Cancel</button>
        <button type="submit" id="save" class="primary" disabled>Save</button>
      </div>
    </form>
  </body>
</html>
