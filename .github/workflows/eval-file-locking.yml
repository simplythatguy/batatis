name: Evaluation file locking

on:
  pull_request:
    branches: [main]
    paths:
      - 'evals_dev/**'
      - 'requirements.txt'
      - '.github/workflows/eval-file-locking.yml'
  push:
    branches: [main]
    paths:
      - 'evals_dev/**'
      - 'requirements.txt'
      - '.github/workflows/eval-file-locking.yml'

permissions:
  contents: read

concurrency:
  group: eval-file-locking-${{ github.ref }}
  cancel-in-progress: true

jobs:
  locking:
    name: Evaluation locks (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ['3.12']
        include:
          - os: windows-latest
            python: '3.14'
    env:
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
      OPENROUTER_API_KEY: ''
      JEV_API_KEY: ''
      BATATIS_LIVE: '0'
      BATATIS_LIVE_ELEPHANT: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.before }}
          path: .baseline
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            evals_dev/requirements.txt
      - name: Install local development dependencies
        run: python -m pip install -r requirements.txt
      - name: Build the same code database for both revisions
        shell: python
        run: |
          import shutil
          import subprocess
          import sys
          from pathlib import Path

          subprocess.run([sys.executable, 'scripts/fetch_sources.py'], check=True)
          subprocess.run([sys.executable, '-m', 'codedb', 'build'], check=True)
          source = Path('codedb/build/codedb.sqlite')
          destination = Path('.baseline/codedb/build/codedb.sqlite')
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(source, destination)
      - name: Run affected suites before the change
        shell: python
        run: |
          import os
          import subprocess
          import sys
          from pathlib import Path

          result = subprocess.run(
              [sys.executable, '-m', 'pytest', '-q', 'evals_dev/identify_bench',
               'evals_dev/data_prompts', '--tb=short'],
              cwd='.baseline', capture_output=True, text=True,
          )
          output = result.stdout + result.stderr
          print(output)
          Path('locking-before.log').write_text(output, encoding='utf-8')
          failures = [line for line in output.splitlines() if line.startswith('E   ')]
          expected_windows_failure = (
              sys.platform == 'win32' and result.returncode == 2 and failures
              and all("ModuleNotFoundError: No module named 'fcntl'" in line for line in failures)
          )
          if result.returncode and not expected_windows_failure:
              sys.exit(result.returncode)
          verdict = 'Expected Windows fcntl import failure reproduced.' if expected_windows_failure else 'Baseline passed.'
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write(verdict + '\n')
      - name: Run locking regressions and affected suites after the change
        run: python -m pytest -q evals_dev/test_file_locking.py evals_dev/identify_bench evals_dev/data_prompts -rs --junitxml=locking-after.xml
      - name: Save before and after test evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: evaluation-locks-${{ matrix.os }}-python-${{ matrix.python }}
          path: |
            locking-before.log
            locking-after.xml
