name: Desktop native acceptance

# Pull requests run the acceptance checks. Releases follow T3 Code's beta and stable channels
# (desktop/scripts/release-plan.mjs): every merge into main publishes a beta, and a stable on
# request ships the latest beta's commit.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      channel:
        description: "Release channel"
        type: choice
        default: beta
        options: [beta, stable]

permissions:
  contents: read

# Pull requests replace their own earlier run; releases queue per channel and are never cancelled.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('desktop-pr-{0}', github.event.pull_request.number) || format('desktop-release-{0}', (github.event_name == 'push' || inputs.channel == 'beta') && 'beta' || 'stable') }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      build: ${{ steps.plan.outputs.build }}
      release: ${{ steps.plan.outputs.release }}
      channel: ${{ steps.plan.outputs.channel }}
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      sha: ${{ steps.plan.outputs.sha }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      notes_start: ${{ steps.plan.outputs.notes_start }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Decide what this run builds
        id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_CHANNEL: ${{ inputs.channel }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            printf 'build=true\nrelease=false\nsha=%s\n' "$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON desktop/scripts/release-plan.mjs
          fi

  packaged:
    name: Packaged desktop (${{ matrix.os }})
    needs: plan
    if: needs.plan.outputs.build == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      OPENAI_API_KEY: ""
      JEV_API_KEY: ""
      ANTHROPIC_API_KEY: ""
      TYPESAFE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      BATATIS_LIVE: "0"
      BATATIS_LIVE_JEV: "0"
      BATATIS_LIVE_ELEPHANT: "0"
      BATATIS_DESKTOP_REQUIRE_CODEX: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            desktop/package-lock.json
            web/package-lock.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: desktop/engine-requirements.txt
      - name: Install the web and desktop dependencies
        run: |
          npm ci --prefix web
          npm ci --prefix desktop
      - name: Freeze the native Python engine
        working-directory: desktop
        run: npm run build:engine
      - name: Prepare the pinned Codex executable the app installs
        working-directory: desktop
        shell: bash
        run: |
          target="$(node -p "process.platform + '-' + process.arch")"
          node codex/fetch.mjs runtime "$target"
      - name: Prepare official sources for isolated test data only
        shell: bash
        run: |
          set -euo pipefail
          py="$(node -p "require('path').resolve('desktop/build/engine-venv', process.platform === 'win32' ? 'Scripts/python.exe' : 'bin/python')")"
          "$py" -m pip install pytest==9.0.2 fonttools==4.60.1
          "$py" scripts/fetch_sources.py
          "$py" -m codedb build
          echo "BATATIS_DESKTOP_PYTHON=$py" >> "$GITHUB_ENV"
      - name: Typecheck and test the desktop host
        working-directory: desktop
        run: |
          npm run typecheck
          npm test
      - name: Repeat the Windows worker shutdown regression
        if: runner.os == 'Windows'
        working-directory: desktop
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..16}; do
            echo "Worker shutdown attempt $attempt/16"
            node --experimental-strip-types --disable-warning=MODULE_TYPELESS_PACKAGE_JSON \
              --import ./scripts/register-ts.mjs --test \
              --test-name-pattern='^optional Jev screening keeps its origin through real Judge worker threads$' \
              tests/workflow-request-lifetime.test.ts
          done
      - name: Exercise the native frozen engine and path regressions
        shell: bash
        run: |
          set -euo pipefail
          exe="$(node -p "require('path').resolve('desktop/build/engine-dist/batatis-engine', process.platform === 'win32' ? 'batatis-engine.exe' : 'batatis-engine')")"
          BATATIS_DESKTOP_ENGINE_EXE="$exe" "$BATATIS_DESKTOP_PYTHON" -m pytest -q \
            engine/tests/test_desktop_bridge.py engine/tests/test_desktop_bridge_pump.py \
            engine/tests/test_desktop_workspace.py codedb/tests/test_store_paths.py \
            engine/tests/test_export_edition_paths.py engine/tests/test_multipart_upload.py
      - name: Stamp the release version
        if: needs.plan.outputs.release == 'true'
        working-directory: desktop
        shell: bash
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: npm pkg set version="$VERSION"
      - name: Package the native app and portable archive
        working-directory: desktop
        env:
          # Windows release builds are signed once the Artifact Signing account exists (docs/desktop.md).
          BATATIS_SIGN_ENDPOINT: ${{ needs.plan.outputs.release == 'true' && runner.os == 'Windows' && vars.BATATIS_SIGN_ENDPOINT || '' }}
          BATATIS_SIGN_ACCOUNT: ${{ vars.BATATIS_SIGN_ACCOUNT }}
          BATATIS_SIGN_PROFILE: ${{ vars.BATATIS_SIGN_PROFILE }}
          BATATIS_SIGN_PUBLISHER: ${{ vars.BATATIS_SIGN_PUBLISHER }}
          AZURE_TENANT_ID: ${{ needs.plan.outputs.release == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ needs.plan.outputs.release == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ needs.plan.outputs.release == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
        run: npm run package
      - name: Check the Windows signatures
        if: runner.os == 'Windows' && needs.plan.outputs.release == 'true' && vars.BATATIS_SIGN_ENDPOINT != ''
        shell: pwsh
        run: |
          $app = Join-Path $env:GITHUB_WORKSPACE 'desktop/build/release/win-unpacked'
          $files = @(Get-Item (Join-Path $app 'Batatis.exe')) + @(Get-ChildItem (Join-Path $app 'resources/engine') -Recurse -Include *.exe,*.dll,*.pyd)
          $unsigned = $files | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($unsigned) { $unsigned.FullName; throw "Unsigned files in the Windows package" }
          "Signed: $($files.Count) files"
      - name: Launch the packaged app twice and verify its private engine
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/Batatis native acceptance"
          "$BATATIS_DESKTOP_PYTHON" desktop/scripts/prepare-smoke.py "$out" codedb/build/codedb.sqlite
          if [ "$RUNNER_OS" = Windows ]; then
            package="$PWD/desktop/build/release/win-unpacked"
          else
            package="$(find "$PWD/desktop/build/release" -maxdepth 2 -name Batatis.app -type d -print -quit)"
          fi
          test -n "$package"
          node desktop/scripts/smoke-packaged.mjs "$package" "$out"
      - name: Capture the macOS Codex request boundary with the packaged catalog, without authentication
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          apps=("$GITHUB_WORKSPACE"/desktop/build/release/*/Batatis.app)
          test "${#apps[@]}" -eq 1
          test -d "${apps[0]}"
          resources="${apps[0]}/Contents/Resources"
          python3 -B desktop/codex/native-check.py \
            --resources-dir "$resources" \
            --executable "$GITHUB_WORKSPACE/desktop/codex/runtime/darwin-arm64/codex" \
            --output "$RUNNER_TEMP/Batatis Codex native acceptance" \
            --deadline-seconds 150
      - name: Capture the Windows Codex request boundary with the packaged catalog, without authentication
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & ./desktop/scripts/windows-codex-native.ps1 `
            -Repo $env:GITHUB_WORKSPACE `
            -ResourcesDir (Join-Path $env:GITHUB_WORKSPACE 'desktop/build/release/win-unpacked/resources') `
            -EvidenceDir (Join-Path $env:RUNNER_TEMP 'Batatis Codex native acceptance')
      - name: Save native reports, logs, and screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-evidence-${{ runner.os }}-${{ runner.arch }}
          path: |
            ${{ runner.temp }}/Batatis native acceptance/report-*.json
            ${{ runner.temp }}/Batatis native acceptance/acceptance.json
            ${{ runner.temp }}/Batatis native acceptance/launch-*.log
            ${{ runner.temp }}/Batatis native acceptance/*.png
            ${{ runner.temp }}/Batatis Codex native acceptance/**
            ${{ runner.temp }}/Batatis Codex native acceptance.firewall-cleanup.json
            desktop/build/release/*.audit.json
          if-no-files-found: warn
          include-hidden-files: true
      - name: Save the portable app archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Batatis-${{ runner.os }}-${{ runner.arch }}
          path: desktop/build/release/*.zip
          if-no-files-found: error

  release:
    name: Publish the ${{ needs.plan.outputs.channel }} release
    needs: [plan, packaged]
    if: needs.plan.outputs.release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Download the accepted portable archives
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: Batatis-*
          path: release
          merge-multiple: true
      - name: Write checksums and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.plan.outputs.tag }}
          SHA: ${{ needs.plan.outputs.sha }}
          VERSION: ${{ needs.plan.outputs.version }}
          CHANNEL: ${{ needs.plan.outputs.channel }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
          NOTES_START: ${{ needs.plan.outputs.notes_start }}
        run: |
          set -euo pipefail
          cd release
          ls Batatis-*.zip
          sha256sum Batatis-*.zip > SHA256SUMS
          cat SHA256SUMS
          args=(--target "$SHA" --generate-notes)
          if [ -n "$NOTES_START" ]; then args+=(--notes-start-tag "$NOTES_START"); fi
          if [ "$PRERELEASE" = true ]; then args+=(--prerelease --title "Batatis Beta $VERSION (${SHA:0:12})"); else args+=(--latest --title "Batatis $VERSION"); fi
          gh release create "$TAG" Batatis-*.zip SHA256SUMS "${args[@]}"
