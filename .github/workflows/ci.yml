name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck, and production build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build
      - name: Code database is not in the static build
        run: node web/scripts/assert-no-codedb.mjs
      - name: UI smoke
        run: |
          npm init -y --prefix "${RUNNER_TEMP}/ui-smoke"
          npm install --prefix "${RUNNER_TEMP}/ui-smoke" playwright-core@1.64.1
          node "${RUNNER_TEMP}/ui-smoke/node_modules/playwright-core/cli.js" install chromium
          chrome="$(find "${HOME}/.cache/ms-playwright" -type f -name chrome -path '*chrome-linux*' | head -n 1)"
          test -n "${chrome}"
          ln -s "${RUNNER_TEMP}/ui-smoke/node_modules" node_modules
          CHROME_PATH="${chrome}" node evals/ui-artifacts/smoke.mjs

  engine:
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Blank on purpose. Live provider tests skip; they must not fail for a missing key.
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      JEV_API_KEY: ""
      TYPESAFE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      RUNWARE_API_KEY: ""
      BATATIS_LIVE_JEV: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            codedb/requirements.txt
            research/precedents/requirements.txt
      - name: Install from requirements files
        run: python -m pip install -r engine/requirements.txt -r codedb/requirements.txt -r research/precedents/requirements.txt
      - name: Engine tests and key-free evals
        run: python -m pytest -q engine/tests codedb/tests evals_dev -rs

  engine-postgres:
    name: engine postgres
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: batatis
          POSTGRES_DB: spend
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U batatis -d spend"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # Loopback service with trust auth. No password. sslmode=disable so the
      # spend URL helper does not add sslmode=require.
      DATABASE_URL: postgresql://batatis@127.0.0.1:5432/spend?sslmode=disable
      OPENAI_API_KEY: ""
      BATATIS_LIVE: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt
      - name: Install engine requirements
        run: python -m pip install -r engine/requirements.txt
      - name: Spend tests against Postgres
        run: python -m pytest -q engine/tests/test_spend_postgres.py engine/tests/test_spend.py -rs

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so both ends of the scanned range are present.
          fetch-depth: 0
          persist-credentials: false
      - name: Install gitleaks 8.30.1
        run: |
          set -euo pipefail
          version=8.30.1
          archive="${RUNNER_TEMP}/gitleaks.tar.gz"
          curl -fsSL -o "${archive}" "https://github.com/gitleaks/gitleaks/releases/download/v${version}/gitleaks_${version}_linux_x64.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  ${archive}" | sha256sum -c -
          tar -xzf "${archive}" -C "${RUNNER_TEMP}" gitleaks
          mkdir -p "${RUNNER_TEMP}/bin"
          install -m 0755 "${RUNNER_TEMP}/gitleaks" "${RUNNER_TEMP}/bin/gitleaks"
          echo "${RUNNER_TEMP}/bin" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/bin/gitleaks" version
      - name: Scan the explicit commit range
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          zero=0000000000000000000000000000000000000000
          if [ "${EVENT_NAME}" = pull_request ]; then
            range="${PR_BASE}..${PR_HEAD}"
          elif [ "${EVENT_NAME}" = push ] && [ "${PUSH_BEFORE}" = "${zero}" ]; then
            echo "github.event.before is all zeros; scanning the full history of ${PUSH_SHA}"
            gitleaks detect --redact --verbose --exit-code=2
            exit
          elif [ "${EVENT_NAME}" = push ]; then
            range="${PUSH_BEFORE}..${PUSH_SHA}"
          else
            echo "unsupported event: ${EVENT_NAME}" >&2
            exit 1
          fi
          echo "gitleaks range: ${range}"
          git rev-parse --verify "${range%%..*}^{commit}" >/dev/null
          git rev-parse --verify "${range##*..}^{commit}" >/dev/null
          # Two-dot range, with no --first-parent and no --no-merges.
          gitleaks detect --redact --verbose --exit-code=2 --log-opts="${range}"
