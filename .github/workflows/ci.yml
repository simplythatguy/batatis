name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    name: web
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install, typecheck, and production build
        working-directory: web
        run: |
          npm ci
          npm run typecheck
          npm run build

  engine:
    name: engine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      # Blank on purpose. Live provider tests skip; they must not fail for a missing key.
      ANTHROPIC_API_KEY: ""
      OPENAI_API_KEY: ""
      JEV_API_KEY: ""
      TYPESAFE_API_KEY: ""
      OPENROUTER_API_KEY: ""
      RUNWARE_API_KEY: ""
      BATATIS_LIVE_JEV: ""
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            engine/requirements.txt
            codedb/requirements.txt
            research/precedents/requirements.txt
      - name: Install from requirements files
        run: python -m pip install -r engine/requirements.txt -r codedb/requirements.txt -r research/precedents/requirements.txt
      - name: Engine tests and key-free evals
        run: python -m pytest -q engine/tests evals_dev -rs

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          # Automatic workflow token, used to read the pull request diff. Not a provider key.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
