<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Batatis: Pitch Deck, Submission 1</title>
<style>
/* ===== Theme variables: restyle here ===== */
:root {
  --slide-w: 1280px;
  --slide-h: 720px;
  --font-sans: "Inter", "Noto Sans", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "DejaVu Sans Mono", Menlo, monospace;
  --color-bg: #ffffff;
  --color-stage: #e9ecef;
  --color-text: #1d2329;
  --color-muted: #5f6b76;
  --color-rule: #d5dbe1;
  --color-accent: #0b6e69;
  --color-accent-soft: #e3f2f1;
  --color-placeholder-bg: #f4f6f8;
  --color-placeholder-border: #9aa6b2;
  --color-example: #8a5a00;
  --color-example-bg: #fff4dc;
  --pad-x: 64px;
  --pad-top: 40px;
  --pad-bottom: 28px;
  --title-size: 38px;
  --rubric-size: 18px;
  --bullet-size: 26px;      /* starting size; script shrinks to fit */
  --bullet-min: 15px;
  --sources-size: 11.5px;
  --radius: 10px;
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--color-stage); font-family: var(--font-sans); color: var(--color-text); }

/* ===== Stage and slide frame ===== */
.deck { position: fixed; inset: 0; overflow: hidden; }
.slide {
  position: absolute; left: 50%; top: 50%;
  width: var(--slide-w); height: var(--slide-h);
  margin-left: calc(var(--slide-w) / -2); margin-top: calc(var(--slide-h) / -2);
  background: var(--color-bg);
  padding: var(--pad-top) var(--pad-x) var(--pad-bottom);
  display: flex; flex-direction: column;
  visibility: hidden; opacity: 0;
  transform: scale(var(--scale, 1));
  box-shadow: 0 6px 30px rgba(0,0,0,.12);
}
.slide.active { visibility: visible; opacity: 1; }

/* ===== Header ===== */
.slide-head { display: flex; align-items: center; gap: 14px; font-size: 14px; color: var(--color-muted); letter-spacing: .04em; }
.brand { font-weight: 700; color: var(--color-accent); text-transform: uppercase; letter-spacing: .12em; }
.slide-num { margin-left: auto; font-variant-numeric: tabular-nums; }

/* ===== Title ===== */
.slide-title { font-size: var(--title-size); line-height: 1.15; font-weight: 700; margin: 14px 0 22px; padding-bottom: 14px; border-bottom: 3px solid var(--color-accent); }
.rubric { font-size: var(--rubric-size); font-weight: 600; color: var(--color-accent); margin-left: 10px; white-space: nowrap; vertical-align: middle; }

/* ===== Body layouts ===== */
.slide-body { flex: 1 1 auto; min-height: 0; display: grid; gap: 36px; }
.layout-text .slide-body { grid-template-columns: 1fr; }
.layout-shot .slide-body { grid-template-columns: 1fr 1.1fr; }
.hero { display: flex; flex-direction: column; margin: 4px 0 26px; }
.hero-num { font-size: 84px; line-height: 1; font-weight: 800; color: var(--color-accent); letter-spacing: -.01em; }
.hero-label { font-size: 22px; color: var(--color-muted); margin-top: 8px; }
.has-hero .bullets, .layout-shot .bullets { --bullet-size: 28px; }
.layout-shot.dense .slide-body { grid-template-columns: 1.55fr 1fr; gap: 28px; }
.bullets-wrap { min-height: 0; overflow: hidden; }
.bullets { margin: 0; padding: 0; list-style: none; font-size: var(--bullet-fs, var(--bullet-size)); line-height: 1.32; }
.layout-text .bullets { --bullet-size: 36px; max-width: 1000px; }
.bullets li { position: relative; padding-left: 1.1em; margin-bottom: .7em; }
.bullets li::before { content: ""; position: absolute; left: 0; top: .5em; width: .42em; height: .42em; border-radius: 50%; background: var(--color-accent); }
.status { color: var(--color-accent); font-weight: 600; white-space: nowrap; }
code { font-family: var(--font-mono); font-size: .92em; }

/* ===== Screenshot slots ===== */
.shots { min-height: 0; display: flex; flex-direction: column; gap: 16px; }
.shot { position: relative; margin: 0; flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; gap: 8px; }
.shot-frame { position: relative; flex: 1 1 auto; min-height: 0; border-radius: var(--radius); overflow: hidden; }
.shot-img { display: none; width: 100%; height: 100%; object-fit: contain; background: var(--color-placeholder-bg); }
.shot.has-img .shot-img { display: block; }
.shot.has-img .shot-placeholder { display: none; }
.shot-placeholder {
  position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;
  gap: 12px; padding: 16px; overflow: hidden;
  background: var(--color-placeholder-bg);
  background-image: repeating-linear-gradient(45deg, transparent 0 14px, rgba(0,0,0,.025) 14px 28px);
  border: 2px dashed var(--color-placeholder-border); border-radius: var(--radius);
  color: var(--color-muted);
}
.shot-icon { flex: 0 0 auto; width: 54px; height: 40px; border: 3px solid var(--color-placeholder-border); border-radius: 6px; position: relative; }
.shots-2 .shot-icon { width: 42px; height: 31px; }
.shot-icon::after { content: ""; position: absolute; left: 50%; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border: 3px solid var(--color-placeholder-border); border-radius: 50%; }
.shots-2 .shot-icon::after { width: 10px; height: 10px; margin: -5px 0 0 -5px; }
.shot-pending { font-size: 18px; font-weight: 600; color: var(--color-muted); letter-spacing: .02em; }
.shot-caption { flex: 0 0 auto; font-size: 16px; line-height: 1.3; color: var(--color-text); text-align: center; }
.example-badge { position: absolute; top: 10px; right: 10px; font-size: 11px; font-weight: 700; letter-spacing: .1em; padding: 4px 8px; border-radius: 4px; color: var(--color-example); background: var(--color-example-bg); border: 1px solid currentColor; }
.slide-badge { position: static; }

/* ===== Sources footer ===== */
.sources { flex: 0 0 auto; margin-top: 14px; padding-top: 8px; border-top: 1px solid var(--color-rule); font-size: var(--sources-size); line-height: 1.4; color: var(--color-muted); }
.sources a { color: inherit; }
.sources-label { font-weight: 700; }

/* ===== Speaker notes (hidden; N toggles panel) ===== */
.notes { display: none; }
#notes-panel { position: fixed; left: 0; right: 0; bottom: 0; max-height: 38vh; overflow: auto; background: #111820; color: #e8edf2; padding: 18px 28px; font-size: 16px; line-height: 1.5; display: none; z-index: 10; }
body.show-notes #notes-panel { display: block; }
#notes-panel h3 { margin: 0 0 4px; font-size: 12px; text-transform: uppercase; letter-spacing: .1em; color: #8fd3cd; }
#notes-panel p, #notes-panel ul { margin: 0 0 12px; }
#notes-panel .timing { font-size: 13px; color: #9aa6b2; }
#notes-panel a { color: #8fd3cd; }

/* ===== Print / PDF: one slide per page ===== */
@page { size: 1280px 720px; margin: 0; }
@media print {
  html, body { background: #fff; height: auto; }
  .deck { position: static; overflow: visible; }
  .slide { position: relative; left: 0; top: 0; margin: 0; transform: none; visibility: visible; opacity: 1; box-shadow: none; page-break-after: always; break-after: page; }
  .slide:last-child { page-break-after: auto; break-after: auto; }
  #notes-panel { display: none !important; }
}
</style>
</head>
<body>
<main class="deck" id="deck">
<!--SLIDES-->
</main>
<div id="notes-panel" aria-live="polite"></div>
<script>
(function () {
  var slides = Array.prototype.slice.call(document.querySelectorAll('.slide'));
  var panel = document.getElementById('notes-panel');
  var cur = 0;

  // Shrink bullet text until it fits its column (layout only; text unchanged).
  function fit() {
    var min = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--bullet-min')) || 15;
    slides.forEach(function (s) {
      var wrap = s.querySelector('.bullets-wrap'), ul = s.querySelector('.bullets');
      ul.style.removeProperty('--bullet-fs');
      var size = parseFloat(getComputedStyle(ul).fontSize);
      while (ul.scrollHeight > wrap.clientHeight + 1 && size > min) {
        size -= 0.5; ul.style.setProperty('--bullet-fs', size + 'px');
      }
    });
  }
  function scale() {
    var sc = Math.min(window.innerWidth / 1280, window.innerHeight / 720) * 0.96;
    document.documentElement.style.setProperty('--scale', sc);
  }
  function show(i) {
    cur = Math.max(0, Math.min(slides.length - 1, i));
    slides.forEach(function (s, k) { s.classList.toggle('active', k === cur); });
    panel.innerHTML = slides[cur].querySelector('.notes').innerHTML;
    if (location.hash !== '#' + (cur + 1)) history.replaceState(null, '', '#' + (cur + 1));
  }
  document.addEventListener('keydown', function (e) {
    var k = e.key;
    if (k === 'ArrowRight' || k === 'ArrowDown' || k === 'PageDown' || k === ' ') { e.preventDefault(); show(cur + 1); }
    else if (k === 'ArrowLeft' || k === 'ArrowUp' || k === 'PageUp') { e.preventDefault(); show(cur - 1); }
    else if (k === 'Home') show(0);
    else if (k === 'End') show(slides.length - 1);
    else if (k === 'n' || k === 'N') document.body.classList.toggle('show-notes');
  });
  window.addEventListener('resize', scale);
  window.addEventListener('load', fit);
  window.addEventListener('beforeprint', fit);
  scale(); fit();
  show((parseInt(location.hash.slice(1), 10) || 1) - 1);
})();
</script>
</body>
</html>
