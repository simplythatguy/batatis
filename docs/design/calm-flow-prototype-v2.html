<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Batatis · v2 prototype</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..650&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
/*
  Batatis v2 visual + flow contract (prototype only, example data).
  High contrast: pure black canvas, white ink, hairlines, no grey card fills.
  Sentence case everywhere. Questions follow Typeform: no cards, one question, keyed answers.
*/
:root {
  --canvas: #000;
  --rail: #050506;
  --raise: #0c0c0e;          /* overlays only: menus, dialogs, assistant */
  --ink: #fafafa;
  --ink-2: #b4b4bb;
  --ink-3: #82828b;
  --line: rgba(255,255,255,.11);
  --line-2: rgba(255,255,255,.2);
  --hover: rgba(255,255,255,.06);
  --selected: rgba(255,255,255,.09);
  --accent: #ff6a3d;
  --accent-ink: #ff9a76;
  --red: #ff5f5f; --amber: #ffc53d; --green: #3ddc84; --grey: #6b6b73;
  --font: "Inter", ui-sans-serif, system-ui, sans-serif;
  --mono: "Geist Mono", ui-monospace, monospace;
  --ease: cubic-bezier(.2,0,0,1);
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { font-family: var(--font); color: var(--ink); -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; }
.switcher { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 12px; }
.switcher button { height: 30px; padding: 0 12px; border-radius: 999px; border: 1px solid rgba(128,128,128,.35); background: transparent; font-size: 12.5px; cursor: pointer; color: inherit; }
.switcher button[aria-pressed="true"] { background: #fafafa; color: #000; border-color: #fafafa; }
.note { font-size: 12.5px; opacity: .7; margin: 0 0 10px; }
.frame-wrap { width: 100%; position: relative; }
.frame { position: absolute; top: 0; left: 0; width: 1440px; height: 900px; background: var(--canvas); transform-origin: top left; border-radius: 18px; overflow: hidden; display: flex; }
.frame.phone { width: 390px; height: 844px; }

/* rail */
.rail { width: 60px; flex: none; background: var(--rail); border-right: 1px solid var(--line); display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 4px; }
.mark { width: 24px; height: 24px; border-radius: 8px 12px 9px 13px; background: radial-gradient(circle at 35% 30%, #ffa27a, var(--accent) 55%, #c63f12); margin-bottom: 18px; }
.rail-btn { position: relative; width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; color: var(--ink-3); border: 0; background: none; cursor: pointer; }
.rail-btn[aria-current="page"] { color: var(--ink); background: var(--selected); }
.rail-btn .badge { position: absolute; top: 7px; right: 7px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 2px var(--rail); }
.rail .spacer { flex: 1; }
.avatar { width: 30px; height: 30px; border-radius: 50%; background: #1d1d21; border: 1px solid var(--line-2); display: grid; place-items: center; font-size: 11.5px; font-weight: 550; color: var(--ink); margin-top: 6px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
svg.i.sm { width: 15px; height: 15px; }

/* list sidebar */
.list { width: 300px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; }
.list-head { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 18px; }
.list-head h2 { font-size: 15px; font-weight: 600; margin: 0; letter-spacing: -.01em; }
.icon-btn { width: 32px; height: 32px; border-radius: 9px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-2); cursor: pointer; }
.icon-btn:hover { background: var(--hover); color: var(--ink); }
.search { margin: 0 12px 10px; height: 36px; border-radius: 10px; border: 1px solid var(--line); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--ink-3); font-size: 13.5px; }
.search kbd { margin-left: auto; font: 500 11px var(--mono); color: var(--ink-3); }
.group-label { font: 500 12px var(--mono); color: var(--ink-3); padding: 14px 18px 6px; }
.row { position: relative; margin: 0 8px; padding: 10px 12px 10px 14px; border-radius: 10px; cursor: pointer; }
.row:hover { background: var(--hover); }
.row[aria-current="page"] { background: var(--selected); border-radius: 0 10px 10px 0; }
.row[aria-current="page"]::before { content: ""; position: absolute; left: -8px; top: 6px; bottom: 6px; width: 3px; border-radius: 3px; background: var(--accent); }
.row .t { font-size: 14px; font-weight: 520; line-height: 1.35; display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .c { display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 12.5px; color: var(--ink-3); }
.row .c.attn { color: var(--accent-ink); }
.row.slim { padding-top: 8px; padding-bottom: 8px; }
.row.slim .t { font-size: 13.5px; color: var(--ink-2); font-weight: 450; }
.dot { width: 7px; height: 7px; border-radius: 50%; flex: none; display: inline-block; }
.dot.red { background: var(--red); } .dot.amber { background: var(--amber); } .dot.green { background: var(--green); } .dot.grey { background: var(--grey); } .dot.accent { background: var(--accent); }

/* ring */
.ring { flex: none; }
.ring .trk { stroke: rgba(255,255,255,.16); }

/* main */
.main { flex: 1; min-width: 0; display: flex; flex-direction: column; position: relative; }
.top { height: 56px; flex: none; display: flex; align-items: center; justify-content: space-between; padding: 0 16px 0 28px; border-bottom: 1px solid var(--line); }
.top .title { font-size: 14.5px; font-weight: 550; display: flex; align-items: center; gap: 10px; min-width: 0; }
.top .title span.meta { color: var(--ink-3); font-weight: 400; }
.stages { display: flex; gap: 6px; }
.stage { position: relative; width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: none; color: var(--ink-3); border-radius: 50%; cursor: pointer; }
.stage svg.ringsvg { position: absolute; inset: 0; width: 40px; height: 40px; transform: rotate(-90deg); }
.stage[aria-current="step"] { color: var(--ink); background: var(--selected); }
.stage .tip { position: absolute; top: 46px; left: 50%; transform: translateX(-50%); white-space: nowrap; font-size: 12px; background: var(--raise); border: 1px solid var(--line-2); padding: 6px 9px; border-radius: 8px; color: var(--ink); opacity: 0; pointer-events: none; z-index: 5; }
.stage:hover .tip { opacity: 1; }
.top-right { display: flex; gap: 8px; align-items: center; }
.btn { height: 38px; padding: 0 16px; border-radius: 10px; border: 1px solid var(--line-2); background: transparent; color: var(--ink); font-size: 14px; font-weight: 520; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { background: var(--hover); }
.btn.primary { background: var(--ink); color: #000; border-color: var(--ink); }
.btn.primary:hover { background: #e4e4e7; }
.btn.ghost { border-color: transparent; color: var(--ink-2); }
.btn.lg { height: 46px; padding: 0 22px; font-size: 15px; border-radius: 12px; }
.btn kbd { font: 500 11px var(--mono); opacity: .6; }
.saved { font-size: 12.5px; color: var(--ink-3); display: flex; align-items: center; gap: 7px; margin-right: 6px; }

/* typeform question */
.q-stage { flex: 1; display: flex; align-items: center; padding: 0 0 0 14%; position: relative; }
.q-wrap { width: min(720px, 72%); }
.q-num { display: flex; align-items: baseline; gap: 10px; color: var(--accent-ink); font-size: 15px; font-weight: 550; margin-bottom: 12px; }
.q-num .sec { color: var(--ink-3); font-weight: 450; font-size: 13.5px; }
.q-text { font-size: 34px; line-height: 1.22; letter-spacing: -.022em; font-weight: 500; margin: 0; }
.q-help { font-size: 17px; line-height: 1.55; color: var(--ink-2); margin: 14px 0 0; max-width: 600px; }
.q-help q { color: var(--ink); quotes: "“" "”"; }
.cite { display: inline-flex; align-items: center; gap: 8px; margin-top: 18px; padding: 6px 12px 6px 8px; border-radius: 999px; border: 1px solid var(--line-2); font: 500 12.5px var(--mono); color: var(--ink-2); cursor: pointer; background: none; }
.cite b { color: var(--ink); font-weight: 500; }
.choices { display: flex; flex-direction: column; gap: 10px; margin-top: 30px; width: 420px; }
.choice { display: flex; align-items: center; gap: 14px; min-height: 50px; padding: 0 16px 0 10px; border-radius: 10px; border: 1px solid var(--line-2); background: transparent; font-size: 17px; text-align: left; cursor: pointer; }
.choice:hover { background: var(--hover); }
.choice .key { width: 26px; height: 26px; border-radius: 6px; border: 1px solid var(--line-2); display: grid; place-items: center; font: 500 12.5px var(--mono); color: var(--ink-2); flex: none; }
.choice[aria-pressed="true"] { border-color: var(--ink); background: rgba(255,255,255,.08); }
.choice[aria-pressed="true"] .key { background: var(--ink); color: #000; border-color: var(--ink); }
.choice .chk { margin-left: auto; opacity: 0; }
.choice[aria-pressed="true"] .chk { opacity: 1; }
.ok-row { display: flex; align-items: center; gap: 14px; margin-top: 26px; }
.ok-row .hint { font-size: 13px; color: var(--ink-3); }
.ok-row .hint b { color: var(--ink-2); font-weight: 600; }
.assist-link { display: inline-flex; align-items: center; gap: 7px; margin-top: 30px; color: var(--ink-3); font-size: 13.5px; background: none; border: 0; padding: 0; cursor: pointer; }
.assist-link:hover { color: var(--ink); }
.underline-input { width: 100%; background: none; border: 0; border-bottom: 1px solid var(--line-2); color: var(--ink); font: 400 26px var(--font); padding: 10px 0 12px; outline: 0; margin-top: 30px; }
.underline-input::placeholder { color: #4a4a52; }

/* section progress */
.progress { flex: none; height: 76px; border-top: 1px solid var(--line); display: flex; align-items: center; gap: 22px; padding: 0 20px 0 28px; }
.secs { flex: 1; display: flex; gap: 14px; }
.sec { flex: var(--n); min-width: 0; cursor: pointer; }
.sec .bar { display: flex; gap: 3px; height: 6px; }
.sec .bar i { flex: 1; border-radius: 3px; background: rgba(255,255,255,.14); position: relative; }
.sec .bar i.done { background: var(--ink); }
.sec .bar i.cur { background: var(--accent); }
.sec .lab { display: flex; justify-content: space-between; margin-top: 9px; font-size: 12.5px; color: var(--ink-3); }
.sec .lab b { color: var(--ink-2); font-weight: 550; }
.sec.on .lab b { color: var(--ink); }
.navs { display: flex; gap: 6px; }
.nav-arrow { width: 36px; height: 36px; border-radius: 9px; border: 1px solid var(--line-2); background: none; display: grid; place-items: center; color: var(--ink); cursor: pointer; }
.qtip { position: absolute; bottom: 68px; background: var(--raise); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 6px; width: 320px; font-size: 13px; z-index: 6; }
.qtip div { display: flex; gap: 10px; padding: 7px 8px; border-radius: 7px; color: var(--ink-2); }
.qtip div.cur { background: var(--selected); color: var(--ink); }
.qtip span.n { font-family: var(--mono); color: var(--ink-3); min-width: 18px; }

/* assistant panel */
.assist { position: absolute; top: 56px; right: 0; bottom: 0; width: 400px; background: var(--raise); border-left: 1px solid var(--line-2); display: flex; flex-direction: column; z-index: 4; }
.assist-head { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px 0 18px; border-bottom: 1px solid var(--line); font-size: 14px; font-weight: 550; }
.assist-body { flex: 1; overflow: auto; padding: 18px; display: flex; flex-direction: column; gap: 16px; font-size: 14.5px; line-height: 1.6; }
.ctx { font-size: 12.5px; color: var(--ink-3); display: flex; gap: 6px; align-items: center; }
.ctx b { color: var(--ink-2); font-weight: 500; }
.msg-user { align-self: flex-end; max-width: 85%; background: rgba(255,255,255,.08); border: 1px solid var(--line); padding: 10px 14px; border-radius: 14px 14px 4px 14px; }
.msg-ai { color: var(--ink); }
.msg-ai .quote { margin: 10px 0; padding: 10px 12px; border-left: 2px solid var(--ink-2); color: var(--ink); background: rgba(255,255,255,.04); border-radius: 0 8px 8px 0; font-size: 14px; }
.msg-ai .fine { color: var(--ink-3); font-size: 12.5px; }
.composer { margin: 12px; border: 1px solid var(--line-2); border-radius: 14px; padding: 12px 12px 10px 14px; }
.composer .ph { color: var(--ink-3); font-size: 14px; height: 40px; }
.composer .foot { display: flex; justify-content: space-between; align-items: center; }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { height: 28px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); display: inline-flex; align-items: center; background: none; }

/* sign-in / onboarding */
.center { flex: 1; display: grid; place-items: center; }
.auth { width: 380px; }
.auth h1 { font-size: 30px; letter-spacing: -.025em; font-weight: 550; margin: 22px 0 6px; }
.auth p.sub { color: var(--ink-2); margin: 0 0 30px; font-size: 15px; }
.field { margin-bottom: 18px; }
.field label { display: block; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
.field .in { height: 46px; border: 1px solid var(--line-2); border-radius: 11px; display: flex; align-items: center; padding: 0 14px; font-size: 15px; color: var(--ink); }
.field .in.ph { color: #55555e; }
.or { display: flex; align-items: center; gap: 12px; color: var(--ink-3); font-size: 12.5px; margin: 22px 0; }
.or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--line); }
.oauth { width: 100%; justify-content: center; margin-bottom: 10px; height: 46px; border-radius: 11px; }
.fine { font-size: 12.5px; color: var(--ink-3); line-height: 1.5; }
.choice .sub { display: block; font-size: 13.5px; color: var(--ink-3); margin-top: 3px; }
.choice.tall { min-height: 70px; padding-top: 12px; padding-bottom: 12px; }

/* review (applicant) */
.page { flex: 1; overflow: hidden; padding: 40px 56px; display: grid; grid-template-columns: 1fr 340px; gap: 56px; }
.h1 { font-size: 34px; letter-spacing: -.025em; font-weight: 550; margin: 0; line-height: 1.15; }
.lead { color: var(--ink-2); font-size: 16px; margin: 12px 0 0; line-height: 1.55; }
.stats { display: flex; gap: 48px; margin: 34px 0 6px; }
.stat .k { font-size: 13px; color: var(--ink-3); }
.stat .v { font-size: 44px; font-weight: 550; letter-spacing: -.03em; margin-top: 4px; }
.stat .v small { font-size: 20px; color: var(--ink-3); font-weight: 450; }
.lrow { display: flex; align-items: center; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); font-size: 15px; }
.lrow .grow { flex: 1; }
.lrow .go { color: var(--ink-2); font-size: 13.5px; }
.engineer { margin-top: 26px; padding: 16px 0 0 18px; border-left: 3px solid var(--amber); }
.engineer b { display: block; font-size: 15px; color: #ffe08a; font-weight: 600; }
.engineer p { margin: 6px 0 0; color: var(--ink-2); font-size: 14.5px; line-height: 1.55; }
.side h3 { font-size: 13px; color: var(--ink-3); font-weight: 500; margin: 0 0 6px; }
.secrow { display: flex; align-items: center; gap: 14px; padding: 13px 0; border-bottom: 1px solid var(--line); }
.secrow .l { width: 30px; height: 30px; border-radius: 50%; border: 1px solid var(--line-2); display: grid; place-items: center; font: 500 12.5px var(--mono); }
.secrow .t { flex: 1; font-size: 14.5px; }
.secrow .t small { display: block; color: var(--ink-3); font-size: 12.5px; margin-top: 2px; }

/* thread */
.banner { margin: 0; padding: 18px 28px; border-bottom: 1px solid var(--line); display: flex; gap: 14px; align-items: flex-start; }
.banner .who { font-size: 14px; font-weight: 550; }
.banner .who span { color: var(--ink-3); font-weight: 400; }
.banner p { margin: 6px 0 0; color: var(--ink); font-size: 15px; line-height: 1.55; max-width: 760px; }
.banner ul { margin: 10px 0 0; padding: 0; list-style: none; }
.banner li { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-2); padding: 4px 0; }
.banner .acts { display: flex; gap: 8px; margin-top: 14px; }
.av { width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-size: 11.5px; font-weight: 600; flex: none; background: #26262b; }

/* reviewer queue */
.queue { flex: 1; padding: 28px 32px; overflow: hidden; }
.queue-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 22px; }
.tabs { display: flex; gap: 4px; }
.tab { height: 32px; padding: 0 12px; border-radius: 8px; border: 0; background: none; color: var(--ink-3); font-size: 13.5px; cursor: pointer; display: inline-flex; align-items: center; gap: 7px; }
.tab[aria-selected="true"] { background: var(--selected); color: var(--ink); }
.tab .n { font: 500 11.5px var(--mono); color: var(--ink-3); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; font-weight: 500; color: var(--ink-3); font-size: 12.5px; padding: 0 12px 10px; border-bottom: 1px solid var(--line-2); }
td { padding: 14px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:hover td { background: rgba(255,255,255,.03); }
td .sub { color: var(--ink-3); font-size: 12.5px; margin-top: 3px; }
.pill { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 10px; border-radius: 999px; border: 1px solid var(--line-2); font-size: 12.5px; color: var(--ink-2); white-space: nowrap; }
.claim { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--ink-2); }
.claim .av { width: 22px; height: 22px; font-size: 10px; }

/* reviewer detail */
.rv { flex: 1; display: grid; grid-template-columns: 1fr 380px; overflow: hidden; }
.sheet-area { padding: 28px; overflow: hidden; display: flex; justify-content: center; border-right: 1px solid var(--line); }
.sheet { width: 600px; background: #fff; color: #111; border-radius: 4px; padding: 40px 48px; font-size: 12.5px; line-height: 1.55; }
.sheet h2 { font-size: 17px; margin: 0 0 2px; }
.sheet .s { color: #6b6b73; font: 400 11px var(--mono); }
.sheet h4 { font-size: 12px; font-weight: 650; margin: 20px 0 8px; color: #333; }
.sheet .kv { display: grid; grid-template-columns: 150px 1fr; gap: 5px 12px; }
.sheet .kv span:nth-child(odd) { color: #6b6b73; }
.sheet .ref { font: 500 10.5px var(--mono); background: #ececef; padding: 2px 6px; border-radius: 4px; }
.sheet .miss { color: #c2410c; }
.rv-side { padding: 24px; display: flex; flex-direction: column; gap: 20px; overflow: hidden; }
.claimed { display: flex; gap: 12px; align-items: center; padding-bottom: 18px; border-bottom: 1px solid var(--line); }
.claimed .txt { font-size: 14px; }
.claimed .txt small { display: block; color: var(--ink-3); font-size: 12.5px; }
.dialog { position: absolute; inset: 0; background: rgba(0,0,0,.6); display: grid; place-items: center; z-index: 8; }
.dialog-box { width: 560px; background: var(--raise); border: 1px solid var(--line-2); border-radius: 16px; padding: 24px; }
.dialog-box h3 { margin: 0; font-size: 19px; font-weight: 600; letter-spacing: -.01em; }
.ta { margin-top: 16px; border: 1px solid var(--line-2); border-radius: 12px; padding: 14px; min-height: 120px; font-size: 14.5px; line-height: 1.6; color: var(--ink); }
.check { display: flex; gap: 10px; align-items: center; font-size: 14px; color: var(--ink-2); padding: 6px 0; }
.box { width: 16px; height: 16px; border-radius: 4px; border: 1px solid var(--line-2); display: grid; place-items: center; }
.box.on { background: var(--ink); border-color: var(--ink); color: #000; }

/* library */
.lib { flex: 1; display: grid; grid-template-columns: 340px 1fr; overflow: hidden; }
.tree { border-right: 1px solid var(--line); padding: 14px 8px; overflow: hidden; font-size: 13.5px; }
.tn { display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 8px; border-radius: 8px; color: var(--ink-2); }
.tn .id { font: 500 12px var(--mono); color: var(--ink-3); min-width: 62px; }
.tn .nm { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
.tn.sel { background: var(--selected); color: var(--ink); }
.tn.l1 { padding-left: 8px; color: var(--ink); font-weight: 550; } .tn.l2 { padding-left: 22px; } .tn.l3 { padding-left: 36px; } .tn.l4 { padding-left: 50px; }
.read { padding: 34px 48px; overflow: hidden; }
.crumbs { font: 400 12.5px var(--mono); color: var(--ink-3); }
.code-text { margin-top: 18px; padding: 14px 0 14px 18px; border-left: 2px solid var(--ink); font-size: 16px; line-height: 1.7; max-width: 680px; }
.roots { display: grid; grid-template-columns: repeat(3, 1fr); gap: 28px; margin-top: 30px; max-width: 760px; }
.roots h5 { font-size: 13px; color: var(--ink-3); font-weight: 500; margin: 0 0 10px; }
.roots .item { font-size: 13.5px; color: var(--ink-2); padding: 4px 0; display: flex; gap: 8px; }
.roots .item .mono { font-family: var(--mono); color: var(--ink); font-size: 12.5px; }
.hover-card { position: absolute; left: 330px; top: 300px; width: 320px; background: var(--raise); border: 1px solid var(--line-2); border-radius: 12px; padding: 14px; font-size: 13px; z-index: 6; line-height: 1.5; }

/* phone */
.phone .main { width: 100%; }
.ph-top { height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 12px; border-bottom: 1px solid var(--line); }

const ic = (n, cls = '') => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

function ring(p, size = 16) {

const NAMES = { signin: 'Sign in', onboarding: 'Onboarding', describe: 'New application', question: 'Question (Typeform)', assistant: 'Assistant open', review: 'Review', returned: 'Returned + message', queue: 'Reviewer queue', reviewdetail: 'Reviewer: return dialog', library: 'Code library', phone: 'Phone' };

let cur = new URLSearchParams(location.search).get('s') || 'question';
function render() {
  frame.className = 'frame' + (cur === 'phone' ? ' phone' : '');
  frame.innerHTML = S[cur]();
  sw.innerHTML = Object.entries(NAMES).map(([k, v]) => `<button aria-pressed="${k === cur}" data-k="${k}">${v}</button>`).join('');
  sw.querySelectorAll('button').forEach(b => b.onclick = () => { cur = b.dataset.k; render(); });
  fit();
}
function fit() {
  const w = cur === 'phone' ? 390 : 1440, h = cur === 'phone' ? 844 : 900;
  const s = Math.min(1, wrap.clientWidth / w);
  frame.style.transform = `scale(${s})`; wrap.style.height = h * s + 'px';
}
