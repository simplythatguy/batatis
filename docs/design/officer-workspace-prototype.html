<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Officer workspace · prototype</title>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--t1:#14161b;--t2:#4a505c;--t3:#6b7280;--t4:#a3a8b3;
  --line:rgba(17,24,39,.08);--line2:rgba(17,24,39,.14);--ctl:rgba(17,24,39,.42);
  --hover:rgba(17,24,39,.04);--sel:rgba(17,24,39,.07);
  --shadow:0 1px 2px rgba(17,24,39,.05),0 4px 16px -6px rgba(17,24,39,.08);
  --accent:#f25a2a;--blocking:#e5484d;--warning:#f0a20b;--done:#18a058;--pending:#9aa0ab;
  --bink:#b42318;--wink:#8a5300;--dink:#11713f;
  --primary:#16181d;--font:"Inter Variable",Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;
  --mono:"Geist Mono Variable",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0;background:transparent}
.app{font:14px/1.5 var(--font);color:var(--t1);background:var(--bg);border-radius:14px;overflow:hidden;border:1px solid var(--line)}
button{font:inherit;color:inherit}
.proto{display:flex;gap:6px;align-items:center;padding:8px 12px;background:#fff;border-bottom:1px solid var(--line);font-size:12px;color:var(--t3);flex-wrap:wrap}
.proto b{font-weight:600;color:var(--t2)}
.proto button{border:1px solid var(--line2);background:#fff;border-radius:999px;padding:2px 10px;cursor:pointer;font-size:12px}
.proto button[aria-pressed=true]{background:var(--sel);border-color:var(--ctl)}
/* header */
.head{display:flex;align-items:center;gap:12px;height:56px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.crumb{color:var(--t3);text-decoration:none}
.leaf{font-weight:500}
.vchip{display:inline-flex;align-items:center;gap:6px;height:26px;padding:0 10px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font:12px var(--mono);color:var(--t2)}
.grow{flex:1}
.ibtn{display:inline-flex;align-items:center;gap:6px;height:32px;padding:0 10px;border:0;border-radius:10px;background:none;cursor:pointer;color:var(--t2)}
.ibtn:hover{background:var(--hover)}
.n{font:600 11px/18px var(--font);min-width:18px;height:18px;padding:0 5px;border-radius:999px;background:var(--sel);color:var(--t1);text-align:center}
/* layout */
.work{display:grid;grid-template-columns:minmax(0,1fr) 380px;align-items:start}
.doc{padding:24px 28px 80px;min-width:0}
.rail{position:sticky;top:0;border-left:1px solid var(--line);min-height:760px;display:flex;flex-direction:column;background:var(--bg)}
/* sheet */
.sheet{max-width:760px;margin:0 auto;background:var(--surface);border-radius:16px;box-shadow:var(--shadow);padding:28px 32px}
.sheet h1{margin:0;font-size:20px;font-weight:600;letter-spacing:-.01em}
.sub{color:var(--t3);font-size:12.5px;margin:2px 0 6px}
.sec{margin-top:22px}
.sec h2{display:flex;align-items:center;gap:10px;margin:0 0 6px;font-size:13px;font-weight:600;color:var(--t2)}
.letter{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;background:var(--sel);font:600 12px var(--mono);color:var(--t1)}
.row{display:grid;grid-template-columns:170px minmax(0,1fr);gap:4px 16px;padding:9px 0;border-top:1px solid var(--line)}
.row>.k{color:var(--t3);font-size:13px}
.row>.v{min-width:0;overflow-wrap:anywhere}
.v .miss{color:var(--bink)}
.chg{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:0 7px;height:20px;border-radius:999px;border:1px solid var(--line2);font-size:11.5px;color:var(--t2);cursor:pointer;background:#fff;vertical-align:1px}
.was[hidden]{display:none}.was{display:block;color:var(--t3);font-size:12.5px;margin-top:2px}
.mono{font-family:var(--mono);font-size:12.5px}
.pill{display:inline-flex;align-items:center;gap:6px;height:22px;padding:0 9px;border-radius:999px;border:1px solid var(--line2);font-size:12px;color:var(--t2);white-space:nowrap}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;flex:none;background:var(--pending)}
.dot.blocking{background:var(--blocking)}.dot.warning{background:var(--warning)}.dot.done{background:var(--done)}.dot.pending{background:var(--pending)}
.dot.ring{background:transparent;box-shadow:inset 0 0 0 2px var(--blocking)}
.code{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 9px;border-radius:8px;background:var(--hover);font:12px var(--mono);color:var(--t1);border:0;cursor:pointer}
.ai{border:1px dashed var(--line2);border-radius:10px;padding:8px 10px;color:var(--t2);font-size:13px}
/* finding card, inline under the row it is about */
.f{grid-column:1/-1;margin:6px 0 2px;border-radius:12px;background:var(--bg);padding:10px 12px;outline:2px solid transparent;transition:outline-color .15s}
.f.is-focus{outline-color:var(--ctl)}
.f-top{display:flex;align-items:center;gap:10px}
.f-title{flex:1;min-width:0;font-weight:500;font-size:13.5px}
.f-title small{display:block;font-weight:400;color:var(--t3);font-size:12px}
.seg{display:inline-flex;border-radius:9px;background:#fff;box-shadow:inset 0 0 0 1px var(--line2);padding:2px;flex:none}
.seg button{border:0;background:none;height:26px;padding:0 10px;border-radius:7px;font-size:12.5px;color:var(--t3);cursor:pointer;display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--primary);color:#fff}
.f-more{border:0;background:none;color:var(--t3);cursor:pointer;width:26px;height:26px;border-radius:7px;display:grid;place-items:center}
.f-more:hover{background:var(--hover)}
.f-body{margin-top:8px;display:grid;gap:8px}
.f-msg{color:var(--t2);font-size:13px}
.srcs{display:grid;gap:6px;margin:0;padding:0;list-style:none}
.src{background:#fff;border-radius:10px;padding:8px 10px;font-size:13px}
.src q{display:block;color:var(--t1);quotes:"“" "”"}
.src .where{display:flex;gap:8px;align-items:center;color:var(--t3);font-size:12px;margin-top:3px}
.link{border:0;background:none;padding:0;color:var(--t1);text-decoration:underline;text-decoration-color:var(--line2);text-underline-offset:3px;cursor:pointer;font-size:12px}
.ask{display:grid;gap:4px}
.ask label{font-size:12px;color:var(--t3)}
textarea{font:13px/1.5 var(--font);color:var(--t1);border:1px solid var(--ctl);border-radius:10px;padding:8px 10px;resize:none;width:100%;background:#fff}
.target{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--t3)}
.dismissed .f-title{color:var(--t3)}
.reason{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:28px;padding:0 11px;border-radius:999px;border:1px solid var(--line2);background:#fff;font-size:12.5px;cursor:pointer}
.chip[aria-pressed=true]{border-color:var(--t1);background:var(--sel)}
/* rail */
.r-sec{padding:18px 20px;border-bottom:1px solid var(--line)}
.r-h{display:flex;align-items:center;gap:8px;margin:0 0 10px;font-size:13px;font-weight:600;color:var(--t2)}
.tally{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:0;padding:0;list-style:none}
.tally li{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;cursor:pointer;border:0;text-align:left}
.tally b{display:block;font-size:22px;font-weight:600;letter-spacing:-.02em;line-height:1.1}
.tally span{display:flex;align-items:center;gap:6px;color:var(--t3);font-size:12px}
.tally li[aria-pressed=true]{box-shadow:inset 0 0 0 1.5px var(--t1)}
.since{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12.5px;color:var(--t2)}
.since span{display:inline-flex;align-items:center;gap:6px}
.tabs{display:flex;gap:4px;padding:10px 20px 0}
.tab{border:0;background:none;padding:6px 10px;border-radius:9px;color:var(--t3);cursor:pointer;display:inline-flex;gap:6px;align-items:center}
.tab[aria-selected=true]{background:var(--sel);color:var(--t1)}
.letter-box{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:14px 16px;font-size:13px;white-space:pre-wrap;max-height:300px;overflow:auto;overscroll-behavior:contain}
.letter-box .ln{color:var(--t3);font-size:12px;white-space:normal;margin-top:8px}
.limit{display:flex;justify-content:space-between;color:var(--t3);font-size:12px;margin-top:6px}
.decide{margin-top:auto;padding:16px 20px 20px;border-top:1px solid var(--line);background:var(--bg);position:sticky;bottom:0}
.scope{display:inline-flex;align-items:center;gap:7px;padding:3px 10px;border-radius:999px;background:var(--hover);color:var(--t3);font-size:12px;margin-bottom:10px}
.acts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--line2);background:#fff;cursor:pointer;white-space:nowrap;font-weight:500}
.btn.primary{background:var(--primary);color:#fff;border-color:var(--primary);grid-column:1/-1}
.btn:disabled{cursor:not-allowed;color:var(--t4);background:transparent}
.btn.primary:disabled{background:var(--sel);border-color:transparent;color:var(--t3)}
.btn:not(:disabled):active{scale:.96}
.btn-sm{height:30px;font-size:12.5px;padding:0 11px}
.hint{color:var(--bink);font-size:12px;margin-top:6px;display:flex;gap:6px;align-items:center}
.pin{font:12px var(--mono);color:var(--t3);margin-bottom:8px;display:flex;gap:6px;align-items:center}
.msgs{display:grid;gap:10px}
.msg{background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:10px 12px;font-size:13px}
.msg .who{color:var(--t3);font-size:12px}
/* dialog */
.scrim{position:absolute;inset:0;background:rgba(20,22,27,.28);display:none;align-items:center;justify-content:center;padding:20px}
.scrim.open{display:flex}
.dlg{width:min(560px,100%);background:#fff;border-radius:18px;box-shadow:0 20px 60px -20px rgba(0,0,0,.35);padding:22px 24px}
.dlg h3{margin:0 0 4px;font-size:18px;font-weight:600}
.dlg p{margin:0 0 12px;color:var(--t2)}
.dlg .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.stage{position:relative}
.banner{display:flex;align-items:center;gap:10px;max-width:760px;margin:0 auto 16px;padding:12px 16px;border-radius:14px;background:#fff;box-shadow:var(--shadow);font-size:13.5px}
.co{display:grid;gap:10px}
.co .step{display:flex;gap:10px;align-items:flex-start;background:#fff;border-radius:12px;box-shadow:var(--shadow);padding:12px 14px;font-size:13px}
.co .step b{display:block;font-weight:600}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.kbd{font:11px var(--mono);color:var(--t3);border:1px solid var(--line2);border-radius:5px;padding:0 4px}
/* phone */
@media (max-width:860px){
  .work{grid-template-columns:1fr}
  .rail{position:static;border-left:0;min-height:0}
  .doc{padding:12px 10px 20px}
  .sheet{padding:18px 16px}
  .row{grid-template-columns:1fr}
  .r-sec.since-sec,.tabs{display:none}
  .decide{position:sticky;bottom:0}
  .head .vchip{display:none}
}
</style>
</head>
<body>
<div class="app" id="app">
  <div class="proto"><b>Prototype · synthetic data</b> State:
    <button data-state="review" aria-pressed="true">Reviewing</button>
    <button data-state="returned" aria-pressed="false">Returned</button>
    <button data-state="accepted" aria-pressed="false">Accepted</button>
    <span class="grow"></span><span>Keys: <span class="kbd">J</span> <span class="kbd">K</span> next / previous · <span class="kbd">A</span> ask · <span class="kbd">D</span> dismiss</span>
  </div>
  <div class="head">
    <a class="crumb" href="#">Queue</a><span style="color:var(--t4)">/</span><span class="leaf">Soffit protection</span>
    <span class="vchip" id="vchip"></span>
    <span class="grow"></span>
    <button class="ibtn" id="openMsgs" aria-label="Messages, 1"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M21 12a8 8 0 0 1-11.8 7L4 20.5l1.5-5A8 8 0 1 1 21 12z"/></svg><span class="n">1</span></button>
    <button class="ibtn" aria-label="More">⋯</button>
  </div>
  <div class="stage">
    <div class="work">
      <main class="doc" id="doc"></main>
      <aside class="rail" id="rail"></aside>
    </div>
    <div class="scrim" id="scrim"><div class="dlg" role="dialog" aria-modal="true" id="dlg"></div></div>
  </div>
</div>
<script>
const APPLICANT = "SYNTHETIC Example Homes";
const VERSION = 3, PREV = 2;
/* Rulebook results (shown, never re-judged here). status: open | not_established. */
const F = [
  {key:"a.date", section:"A", field:"Date of request", sev:"blocking", status:"open",
   title:"Signature date is blank", msg:"The owner signed but the date beside the signature is empty.",
   sources:[{q:"", where:"scc-form.pdf · page 2 · field “Date1” · blank", page:2}], codes:[],
   ask:"Add the date beside the owner’s signature on page 2.", target:"Section A · Date of request", changed:false},
  {key:"b.legal", section:"B", field:"Legal description", sev:"blocking", status:"not_established",
   title:"Plan number couldn’t be read", msg:"The scanned page is unclear here. Look at the page yourself before asking.",
   sources:[{q:"Lot 12  Block 3  Plan 00▯▯▯▯0", where:"scc-form.pdf · page 1 · scanned", page:1},{q:"Plan No. 00▯▯0 (east lot)", where:"site-plan.pdf · page 1", page:1}], codes:[],
   ask:"Confirm the plan number in the legal description.", target:"Section B · Legal description", changed:true},
  {key:"c.page", section:"C", field:"9.10.15.5.(8)", sev:"warning", status:"open",
   title:"Page reference differs", msg:"The article exists in NBC(AE) 2023, 2nd printing. The page cited on the form is another printing’s.",
   sources:[{q:"Art. 9.10.15.5.(8), p. 712", where:"scc-form.pdf · page 1 · field “Article(s)”", page:1}], codes:["9.10.15.5.(8)"],
   ask:"Cite the 2023 Alberta Edition, 2nd printing page for 9.10.15.5.(8).", target:"Section C · Code reference", changed:false},
  {key:"d.file", section:"D", field:"Soffit fire test report", sev:"blocking", status:"open",
   title:"Listed, but no file attached", msg:"Section D lists the test report; no uploaded file matches it.",
   sources:[{q:"SYNTHETIC soffit fire test report — Example Labs Inc.", where:"scc-form.pdf · page 2 · field “Supporting Doc”", page:2}], codes:[],
   ask:"Attach the soffit fire test report listed in Section D.", target:"Section D · Soffit fire test report", changed:false},
  {key:"d.resp", section:"D", field:"Responsible person", sev:"warning", status:"open",
   title:"Responsible person not named", msg:"The report names a firm but no person who takes responsibility for it.",
   sources:[{q:"Issued by: SYNTHETIC Example Labs Inc.", where:"test-report.pdf · page 1", page:1},{q:"Sealed by: SYNTHETIC P.Eng. (no real seal)", where:"test-report.pdf · page 4", page:4}], codes:[],
   ask:"Name the person responsible for the test report.", target:"Section D · Soffit fire test report", changed:false},
  {key:"p.lapse", section:"P", field:"Maintenance", sev:"warning", status:"open",
   title:"Lapsed maintenance not addressed", msg:"Division C asks the file to say what happens if maintenance lapses.",
   sources:[{q:"Annual inspection of the soffit.", where:"Applicant’s answer · Maintenance", page:null}], codes:["2.3.1.1.(2)(b)"],
   ask:"Say what happens if the soffit maintenance lapses.", target:"Alternative path · Maintenance", changed:true},
];
const DIFF = {fixed:3, open:2, added:1, unknown:1};
const REASONS = ["Found elsewhere in the file","Not needed for this request","The check doesn’t fit"];
let state = "review";
let disp = Object.fromEntries(F.map(f=>[f.key,{kind:"ask", text:f.ask}]));
disp["c.page"] = {kind:"dismissed", reason:"The check doesn’t fit", note:"Page given is the 2nd printing PDF page; fine.", text:F[2].ask};
let open = new Set(["b.legal"]);
let focusKey = "b.legal";
let filter = "all";
let tab = "request";
let intro = `Thank you for your variance application. Before it can be accepted as administratively complete, please address the items below, then send the application again.`;
let extra = [];  // officer items: {text, target}
let sentText = "";

/* One definition of every count, used everywhere. */
function tally(){
  let required=0, check=0, dismissed=0, asked=0;
  for(const f of F){
    const d = disp[f.key];
    if(d.kind==="dismissed"){dismissed++;continue}
    asked++;
    // Not established stays required until the officer looks: it never silently stops blocking.
    if(f.sev==="blocking") required++; else check++;
  }
  return {required, check, dismissed, asked: asked + extra.length};
}
function letterText(){
  const items = F.filter(f=>disp[f.key].kind==="ask").map(f=>disp[f.key].text).concat(extra.map(e=>e.text));
  return [intro.trim(),"",...items.map((t,i)=>`${i+1}. ${t}`)].join("\n");
}
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const ico = {
  chev:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="m6 9 6 6 6-6"/></svg>',
  file:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/></svg>',
  pin:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M20 10c0 6-8 12-8 12S4 16 4 10a8 8 0 0 1 16 0z"/><circle cx="12" cy="10" r="3"/></svg>',
  check:'<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M20 6 9 17l-5-5"/></svg>',
  x:'<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>',
};

function findingCard(f){
  const d = disp[f.key], isOpen = open.has(f.key), ro = state!=="review";
  const tone = d.kind==="dismissed" ? "pending" : f.sev;
  const dotCls = f.status==="not_established" && d.kind!=="dismissed" ? "ring" : tone;
  const sub = d.kind==="dismissed" ? `Dismissed · ${esc(d.reason)}` : f.status==="not_established" ? "Couldn’t be established · look first · still required" : f.sev==="blocking" ? "Required" : "To check";
  return `<div class="f ${d.kind==="dismissed"?"dismissed":""} ${focusKey===f.key?"is-focus":""}" id="f-${f.key}" data-key="${f.key}">
    <div class="f-top">
      <span class="dot ${dotCls}" aria-hidden="true"></span>
      <span class="f-title">${esc(f.title)}<small>${sub}</small></span>
      ${ro?"":`<span class="seg" role="group" aria-label="${esc(f.title)}">
        <button aria-pressed="${d.kind==="ask"}" data-act="ask" data-key="${f.key}">Ask</button>
        <button aria-pressed="${d.kind==="dismissed"}" data-act="dismiss" data-key="${f.key}">Dismiss</button></span>`}
      <button class="f-more" aria-expanded="${isOpen}" aria-label="Details" data-act="toggle" data-key="${f.key}" style="rotate:${isOpen?"180deg":"0deg"}">${ico.chev}</button>
    </div>
    ${isOpen?`<div class="f-body">
      <div class="f-msg">${esc(f.msg)}</div>
      <ul class="srcs">${f.sources.map(s=>`<li class="src">${s.q?`<q>${esc(s.q)}</q>`:""}<span class="where">${ico.file}${esc(s.where)}${s.page?` · <button class="link" data-act="openfile">Open page ${s.page}</button>`:""}</span></li>`).join("")}</ul>
      ${f.codes.length?`<div>${f.codes.map(c=>`<button class="code">${c} · Show the code</button>`).join(" ")}</div>`:""}
      ${d.kind==="ask"?`<div class="ask"><label for="t-${f.key}">They read</label>
        <textarea id="t-${f.key}" rows="2" maxlength="600" data-act="text" data-key="${f.key}" ${ro?"disabled":""}>${esc(d.text)}</textarea>
        <span class="target">${ico.pin}They answer at · ${esc(f.target)}</span></div>`
      : `<div class="ask"><label>Why you dismissed it</label>
        <div class="reason">${REASONS.map(r=>`<button class="chip" aria-pressed="${d.reason===r}" data-act="reason" data-key="${f.key}" data-r="${esc(r)}" ${ro?"disabled":""}>${esc(r)}</button>`).join("")}</div>
        <textarea rows="2" maxlength="300" placeholder="${f.sev==="blocking"?"A short note (needed for a required item)":"A short note (optional)"}" data-act="note" data-key="${f.key}" ${ro?"disabled":""}>${esc(d.note||"")}</textarea>
        <span class="target">Kept in the record · the applicant doesn’t see it</span></div>`}
    </div>`:""}
  </div>`;
}
const cards = (pred) => F.filter(pred).filter(f=>visible(f)).map(findingCard).join("");
function visible(f){
  const d = disp[f.key];
  if(filter==="required") return d.kind==="ask" && f.sev==="blocking";
  if(filter==="check") return d.kind==="ask" && f.sev!=="blocking";
  if(filter==="dismissed") return d.kind==="dismissed";
  return true;
}
const row = (k,v,after="") => `<div class="row"><span class="k">${k}</span><span class="v">${v}</span>${after}</div>`;
const forField = (field) => cards(f=>f.field===field);

function renderDoc(){
  const changed = (was) => `<button class="chg" data-act="was" title="Changed since version ${PREV}">Changed</button><span class="was" hidden>Version ${PREV}: ${esc(was)}</span>`;
  let banner = "";
  if(state==="returned") banner = `<div class="banner"><span class="dot warning"></span><span><b>Returned today, 2:41 PM</b> · with ${tally().asked} items · read-only until ${APPLICANT} sends it again</span></div>`;
  if(state==="accepted") banner = `<div class="banner"><span class="dot done"></span><span><b>Accepted as administratively complete</b> · technical review is next · this is not a variance and not a design approval</span></div>`;
  document.getElementById("doc").innerHTML = banner + `<article class="sheet" aria-label="Application">
    <h1>Safety Codes Variance · Part 1</h1>
    <div class="sub">NBC(AE) 2023, 2nd printing · version ${VERSION} · sent today, 9:12 AM</div>
    <section class="sec"><h2><span class="letter">A</span>Applicant</h2>
      ${row("Owner","SYNTHETIC Example Homes Ltd.")}
      ${row("Representative","SYNTHETIC J. Example")}
      ${row("Mailing address",`000 Example Avenue NW, Edmonton AB ${changed("000 Example Ave, Edmonton")}`)}
      ${row("Date of request",`<span class="miss">— missing</span>`, forField("Date of request"))}
    </section>
    <section class="sec"><h2><span class="letter">B</span>Project</h2>
      ${row("Municipal address","000 Example Crescent SW, Calgary AB")}
      ${row("Legal description",`Lot 12 · Block 3 · Plan <span class="miss">unreadable</span> ${changed("Lot 12 · Block 3")}`, forField("Legal description"))}
      ${row("Proposed alternative","SYNTHETIC: a protected roof soffit on the east exposing building face, where the limiting distance is 0.40 m.")}
    </section>
    <section class="sec"><h2><span class="letter">C</span>Code references</h2>
      ${row(`<span class="mono">9.10.15.5.(8)</span>`,`<span class="pill"><span class="dot done"></span>Found · 2nd printing</span> <span class="pill"><span class="dot done"></span>OP3.1 · F03 match the table</span>`, forField("9.10.15.5.(8)"))}
    </section>
    <section class="sec"><h2><span class="letter">D</span>Supporting documents</h2>
      ${row("Soffit fire test report",`Example Labs Inc. · 2026-09-30 · <span class="miss">no file</span>`, forField("Soffit fire test report")+forField("Responsible person"))}
    </section>
    <section class="sec"><h2><span class="letter">P</span>Alternative path · written by the applicant</h2>
      ${row("Risk assessment","SYNTHETIC applicant passage: fire spread from the soffit to the neighbouring house.")}
      ${row("Mitigating measures","SYNTHETIC: noncombustible soffit at the exposing building face.")}
      ${row("Maintenance",`Annual inspection of the soffit. ${changed("—")}`, forField("Maintenance"))}
      ${row("File checklist",`<span class="pill"><span class="dot done"></span>Code analysis</span> <span class="pill"><span class="dot done"></span>Testing</span> <span class="pill"><span class="dot done"></span>Qualifications</span> <span class="pill"><span class="dot warning"></span>Lapsed maintenance</span>`)}
    </section>
  </article>`;
}

function renderRail(){
  const t = tally();
  document.getElementById("vchip").textContent = `v${VERSION} · on screen`;
  const tile = (id,n,label,tone) => `<li role="button" tabindex="0" aria-pressed="${filter===id}" data-act="filter" data-f="${id}"><b>${n}</b><span><span class="dot ${tone}"></span>${label}</span></li>`;
  const since = `<div class="r-sec since-sec"><p class="r-h">Since version ${PREV}</p><div class="since">
    <span><span class="dot done"></span>${DIFF.fixed} fixed</span><span><span class="dot warning"></span>${DIFF.open} still open</span>
    <span><span class="dot blocking"></span>${DIFF.added} new</span><span><span class="dot pending"></span>${DIFF.unknown} can’t tell</span></div></div>`;
  const text = state==="review" ? letterText() : sentText || letterText();
  const LIMIT = 6000;
  const req = `<div class="r-sec"><p class="r-h">${state==="review"?`What ${APPLICANT} receives`:`Sent today, 2:41 PM`}<span class="grow"></span>${state==="review"?`<button class="btn btn-sm" data-act="add">Add item</button>`:""}</p>
    <div class="letter-box" aria-label="Request text">${esc(text)}</div>
    ${state==="review"?`<div class="limit"><span>${t.asked} items · each has a place to answer</span><span>${text.length} / ${LIMIT}</span></div>`:""}</div>`;
  const msgs = `<div class="r-sec"><div class="msgs">
    <div class="msg"><div class="who">You · today, 2:41 PM</div>Returned with ${t.asked} items.</div>
    <div class="msg"><div class="who">You · Oct 21</div>Returned with 6 items.</div>
    <div class="msg"><div class="who">${APPLICANT} · today, 9:12 AM · status</div>Sent version 3.</div></div>
    <p class="limit"><span>One way · they answer by fixing and resending</span></p></div>`;
  let decide = "";
  if(state==="review"){
    const block = t.required>0;
    decide = `<div class="decide"><div class="pin">${ico.pin}Deciding on version ${VERSION} · saved 9:12 AM</div>
      <div class="scope">Completeness only · not a design approval</div>
      <div class="acts">
        <button class="btn primary" data-act="return" ${t.asked?"":"disabled"}>Return with ${t.asked} ${t.asked===1?"item":"items"}</button>
        <button class="btn" data-act="accept" ${block?"disabled":""} aria-describedby="why">${ico.check}Accept</button>
        <button class="btn" data-act="refuse">Refuse</button>
      </div>
      ${block?`<p class="hint" id="why"><span class="dot blocking"></span>${t.required} required ${t.required===1?"item":"items"} open · ask or dismiss</p>`:""}
    </div>`;
  } else if(state==="accepted"){
    decide = `<div class="r-sec co"><p class="r-h">Close-out</p>
      <div class="step"><span class="dot done"></span><span><b>Administratively complete</b>Today · technical review next</span></div>
      <div class="step"><span class="dot pending"></span><span><b>Variance not issued yet</b>When you issue it, record the date. The copy to the Safety Codes Council is due 10 days after.</span></div>
      <button class="btn">Record variance issued</button></div>`;
  }
  document.getElementById("rail").innerHTML = `
    <div class="r-sec"><ul class="tally" aria-label="Counts">
      ${tile("required",t.required,"Required","blocking")}${tile("check",t.check,"To check","warning")}${tile("dismissed",t.dismissed,"Dismissed","pending")}
    </ul></div>
    ${since}
    <div class="tabs" role="tablist"><button class="tab" role="tab" aria-selected="${tab==="request"}" data-act="tab" data-t="request">Request <span class="n">${t.asked}</span></button><button class="tab" role="tab" aria-selected="${tab==="messages"}" data-act="tab" data-t="messages">Messages <span class="n">3</span></button></div>
    ${tab==="request"?req:msgs}
    ${decide}`;
}
function render(){renderDoc();renderRail();}

function dialog(html){const s=document.getElementById("scrim");document.getElementById("dlg").innerHTML=html;s.classList.add("open");}
function closeDlg(){document.getElementById("scrim").classList.remove("open");}

document.addEventListener("click",e=>{
  const b = e.target.closest("[data-act],[data-state]"); if(!b) return;
  if(b.dataset.state){state=b.dataset.state;document.querySelectorAll("[data-state]").forEach(x=>x.setAttribute("aria-pressed",x===b));if(state!=="review")sentText=letterText();render();return;}
  const k=b.dataset.key, a=b.dataset.act;
  if(a==="ask"){disp[k]={kind:"ask",text:disp[k].text};focusKey=k;render();}
  else if(a==="dismiss"){disp[k]={kind:"dismissed",reason:REASONS[0],note:"",text:disp[k].text};open.add(k);focusKey=k;render();}
  else if(a==="toggle"){open.has(k)?open.delete(k):open.add(k);focusKey=k;render();}
  else if(a==="reason"){disp[k].reason=b.dataset.r;render();}
  else if(a==="filter"){filter=filter===b.dataset.f?"all":b.dataset.f;render();}
  else if(a==="tab"){tab=b.dataset.t;render();}
  else if(a==="was"){const w=b.nextElementSibling;w.hidden=!w.hidden;}
  else if(a==="return"){const t=tally();dialog(`<h3>Return to ${APPLICANT}?</h3><p>They get exactly this, fix the application and send it again. They can’t reply.</p><div class="letter-box">${esc(letterText())}</div><p class="ln" style="margin-top:10px;color:var(--t3);font-size:12px">Version ${VERSION} · ${t.asked} items · sent and returned together, or not at all</p><div class="foot"><button class="btn" data-act="close">Not yet</button><button class="btn primary" style="grid-column:auto" data-act="doreturn">Return</button></div>`);}
  else if(a==="doreturn"){closeDlg();sentText=letterText();state="returned";document.querySelectorAll("[data-state]").forEach(x=>x.setAttribute("aria-pressed",x.dataset.state==="returned"));render();}
  else if(a==="accept"){dialog(`<h3>Accept as administratively complete?</h3><p>${APPLICANT} is told the file is complete. This is not a variance and not a design approval; technical review comes next.</p><div class="foot"><button class="btn" data-act="close">Not yet</button><button class="btn primary" style="grid-column:auto" data-act="doaccept">Accept as complete</button></div>`);}
  else if(a==="doaccept"){closeDlg();state="accepted";render();}
  else if(a==="close"){closeDlg();}
  else if(a==="add"){extra.push({text:"Please provide …",target:"General"});render();}
});
document.addEventListener("input",e=>{const t=e.target;const k=t.dataset.key;if(t.dataset.act==="text"){disp[k].text=t.value;renderRail();}if(t.dataset.act==="note"){disp[k].note=t.value;}});
document.addEventListener("keydown",e=>{
  if(e.target.matches("textarea")||state!=="review") return;
  const keys=F.map(f=>f.key);let i=keys.indexOf(focusKey);
  if(e.key==="j"){focusKey=keys[Math.min(i+1,keys.length-1)];render();document.getElementById("f-"+focusKey)?.scrollIntoView({block:"center"});}
  if(e.key==="k"){focusKey=keys[Math.max(i-1,0)];render();document.getElementById("f-"+focusKey)?.scrollIntoView({block:"center"});}
  if(e.key==="a"){disp[focusKey]={kind:"ask",text:disp[focusKey].text};render();}
  if(e.key==="d"){disp[focusKey]={kind:"dismissed",reason:REASONS[0],note:"",text:disp[focusKey].text};open.add(focusKey);render();}
});
render();
</script>
