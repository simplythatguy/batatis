<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Batatis — Intake</title>
    <link rel="stylesheet" href="../../docs/design/tokens.css" />
    <style>
      .form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: var(--space-3) var(--space-4);
        padding: var(--space-4);
      }
      .form-grid .full {
        grid-column: 1 / -1;
      }
      .panel-body {
        overflow: auto;
        flex: 1;
      }
      .section-block {
        display: none;
      }
      .section-block[data-active="true"] {
        display: grid;
      }
      .tab-count {
        color: var(--text-tertiary);
        font-variant-numeric: tabular-nums;
        margin-left: 4px;
      }
      .tab-count:empty {
        display: none;
      }
      .assumption {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: var(--text-xs);
        color: var(--text-secondary);
      }
    </style>
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="workspace">Batatis <span class="meta">▾</span></div>
        <div class="nav-group">
          <div class="nav-item active" data-active="true">
            <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="2" y="3" width="12" height="10" rx="1.5"/><path d="M5 6.5h6M5 9.5h4"/></svg>Intake
          </div>
          <div class="nav-item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M6 4L3 8l3 4M10 4l3 4-3 4"/></svg>Code identification</div>
          <div class="nav-item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M3 4h10M3 8h10M3 12h6"/></svg>Section C</div>
          <div class="nav-item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M4 3h6l3 3v7H4V3z"/><path d="M10 3v3h3"/></svg>Evidence plan</div>
          <div class="nav-item"><svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M8 3v7M5.5 7.5 8 10l2.5-2.5M3 13h10"/></svg>Export</div>
        </div>
        <div>
          <div class="sidebar-section-label">Project</div>
          <div class="nav-item" data-project-label></div>
        </div>
      </aside>
      <main class="main-panel">
        <header class="panel-header">
          <h1 class="panel-title">Applicant intake</h1>
          <span class="meta">Variance Template · Sections A–B</span>
        </header>
        <div class="gap-strip" id="gap-strip" aria-label="Administrative gaps"></div>
        <div class="toolbar" role="tablist">
          <button type="button" class="pill active" data-active="true" data-tab="A">Section A <span class="tab-count" data-tab-count="A"></span></button>
          <button type="button" class="pill" data-tab="B">Section B <span class="tab-count" data-tab-count="B"></span></button>
          <button type="button" class="pill" data-tab="assumptions">Assumptions <span class="tab-count" data-tab-count="assumptions"></span></button>
        </div>
        <div class="panel-body">
          <div class="form-grid section-block" data-section="A" data-active="true">
            <div class="field">
              <div class="field-label-row"><label>Owner</label></div>
              <input value="Amina Okonkwo" />
              <span class="confidence"><span class="status-dot warning"></span>Inferred · confirm</span>
            </div>
            <div class="field is-empty">
              <div class="field-label-row">
                <span class="status-dot blocking"></span><label>Representative</label>
              </div>
              <input placeholder="Required" />
            </div>
            <div class="field is-empty">
              <div class="field-label-row">
                <span class="status-dot blocking"></span><label>Mailing address</label>
              </div>
              <input placeholder="Required" />
            </div>
            <div class="field">
              <label>Date</label>
              <input value="2026-10-20" />
            </div>
          </div>
          <div class="form-grid section-block" data-section="B">
            <div class="field">
              <label>Permit #</label>
              <input placeholder="If issued" />
            </div>
            <div class="field">
              <label>Jurisdiction-wide variance?</label>
              <select>
                <option>No — site specific</option>
                <option>Yes</option>
              </select>
            </div>
            <div class="field is-empty full">
              <div class="field-label-row">
                <span class="status-dot blocking"></span><label>Municipal address</label>
              </div>
              <input placeholder="Required" />
            </div>
            <div class="field full">
              <div class="field-label-row">
                <span class="status-dot warning"></span><label>Legal description / ATS</label>
              </div>
              <input value="NW-12-24-1-W5" />
              <label class="assumption"><input type="checkbox" checked /> Treat as assumption until verified</label>
            </div>
            <div class="field full">
              <label>Proposed alternative (clear description)</label>
              <textarea rows="3">Load-bearing straw-bale wall assembly as alternative to NBC(AE) Part 9 acceptable solution for exterior walls.</textarea>
            </div>
          </div>
          <div class="form-grid section-block" data-section="assumptions">
            <div class="field full">
              <label>Labeled assumptions</label>
              <textarea rows="4">ATS legal description (NW-12-24-1-W5) is unverified and marked as assumption.</textarea>
            </div>
          </div>
        </div>
        <div class="footer-bar">
          <button type="button" class="btn btn-ghost">Save draft</button>
          <button type="button" class="btn btn-primary">Continue to code identification</button>
        </div>
      </main>
    </div>
    <script type="module">
      import { getGaps, renderGapStrip, renderProjectLabel } from "./shared-gaps.js";
      renderProjectLabel();
      const tabGapIds = { A: ["rep", "mail"], B: ["muni", "ats-assumption"], assumptions: [] };
      const gapIds = new Set(getGaps().map((g) => g.id));
      document.querySelectorAll("[data-tab-count]").forEach((el) => {
        const n = tabGapIds[el.dataset.tabCount].filter((id) => gapIds.has(id)).length;
        el.textContent = n ? String(n) : "";
      });
      renderGapStrip(document.getElementById("gap-strip"));
      const tabs = document.querySelectorAll("[data-tab]");
      const sections = document.querySelectorAll("[data-section]");
      tabs.forEach((tab) => {
        tab.addEventListener("click", () => {
          tabs.forEach((t) => {
            t.classList.toggle("active", t === tab);
            t.dataset.active = t === tab ? "true" : "false";
          });
          sections.forEach((s) => {
            s.dataset.active = s.dataset.section === tab.dataset.tab ? "true" : "false";
          });
        });
      });
    </script>
  </body>
</html>
